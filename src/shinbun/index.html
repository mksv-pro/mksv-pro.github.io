  <script>
    (function () {
      // the works: more than three, and the strip moves on by one every 6 s (from the right, as the page
      // reads), back to the first after the last; it stops while pointed at or focused, and never moves
      // for reduced motion. Three or fewer: nothing moves.
      var strip = document.querySelector('.works');
      if (strip.children.length > 3 && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var held = false; strip.classList.add('rolling');
        ['pointerenter', 'focusin'].forEach(function (e) { strip.addEventListener(e, function () { held = true; }); });
        ['pointerleave', 'focusout'].forEach(function (e) { strip.addEventListener(e, function () { held = false; }); });
        setInterval(function () {
          if (held || document.hidden) return;
          var step = strip.children[0].getBoundingClientRect().width, end = strip.scrollWidth - strip.clientWidth;
          if (Math.abs(strip.scrollLeft) >= end - 2) strip.scrollTo({ left: 0, behavior: 'smooth' });
          else strip.scrollBy({ left: -step, behavior: 'smooth' });  // (right to left: scrollLeft runs negative)
        }, 6000);
      }

      // today's issue: the reader's date in kanji, the issue number (days since 1 Sep 2021)
      var K = '〇一二三四五六七八九';
      var digits = function (n) { return String(n).replace(/\d/g, function (c) { return K[c]; }); };
      var num = function (n) { var t = Math.floor(n / 10), o = n % 10; return (t ? (t > 1 ? K[t] : '') + '十' : '') + (o ? K[o] : ''); };
      var d = new Date();
      var issue = Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(2021, 8, 1)) / 864e5);
      document.querySelector('.mast .issue').textContent = '第' + digits(issue) + '號';
      document.querySelector('.mast .day').textContent = digits(d.getFullYear()) + '年' + num(d.getMonth() + 1) + '月' + num(d.getDate()) + '日';

      // Bose-Einstein condensation, as the 1995 absorption images showed it: the velocity distribution of
      // a trapped Bose gas after time of flight, at three temperatures across T_c. Thermal part: the Bose
      // distribution integrated along the line of sight, g2(z exp(-k^2 / 2T)), isotropic; condensate: a
      // Thomas-Fermi parabola to the 3/2, anisotropic; condensed fraction 1 - (T/T_c)^3. k in units of the
      // thermal width at T_c. Drawn by the graphics card as a meshed surface coloured by height, under an
      // imaging noise that drifts from one exposure's grain to the next; the clouds cool and warm, and the
      // camera turns round them, on the run below (camAt).
      var cv = document.querySelector('.field');
      var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var G = 58, K = 2.1, TEMPS = [1.03, 0.8, 0.3], N = TEMPS.length * G * G;
      var INV2 = [], INV3 = []; for (var j0 = 1; j0 <= 60; j0++) { INV2.push(1 / (j0 * j0)); INV3.push(1 / (j0 * j0 * j0)); }
      var poly = function (x, inv) { var s = 0, xj = 1; for (var j = 0; j < 60; j++) { xj *= x; s += xj * inv[j]; } return s; };
      // each panel: its thermal part and its condensate apart, the condensate blurred by the imaging's
      // resolution (a Gaussian, sigma BLUR), which gives the peaks their flaring base; each part on its own
      // linear scale (the thermal bump up to THERM of the tallest peak), so neither flattens the other
      var BLUR = 0.16, THERM = 0.42;
      function blur(v) {  // separable Gaussian on the G x G grid
        var h = 2 * K / (G - 1), r = Math.ceil(3 * BLUR / h), w = [], s = 0, out = v.slice(), tmp = v.slice();
        for (var d = -r; d <= r; d++) { w.push(Math.exp(-0.5 * (d * h / BLUR) * (d * h / BLUR))); s += w[w.length - 1]; }
        w = w.map(function (x) { return x / s; });
        for (var i = 0; i < G; i++) for (var j = 0; j < G; j++) { var a = 0; for (var d2 = -r; d2 <= r; d2++) { var jj = j + d2; if (jj >= 0 && jj < G) a += w[d2 + r] * v[i * G + jj]; } tmp[i * G + j] = a; }
        for (var i2 = 0; i2 < G; i2++) for (var j2 = 0; j2 < G; j2++) { var b = 0; for (var d3 = -r; d3 <= r; d3++) { var ii = i2 + d3; if (ii >= 0 && ii < G) b += w[d3 + r] * tmp[ii * G + j2]; } out[i2 * G + j2] = b; }
        return out;
      }
      // the shapes, tabulated over temperature (NT rows from TLO to THI) so that a panel can cool and warm:
      // below T_c, z = 1 and the condensed fraction is 1 - T^3; above, no condensate and z from
      // g3(z) = zeta(3) / T^3 (the atom number held), by bisection
      var NT = 48, TLO = 0.28, THI = 1.25, Z3 = poly(1, INV3);
      var fug = function (T) { if (T <= 1) return 1; var lo = 0, hi = 1; for (var it = 0; it < 40; it++) { var mid = (lo + hi) / 2; if (poly(mid, INV3) * T * T * T < Z3) lo = mid; else hi = mid; } return (lo + hi) / 2; };
      var rows = []; for (var r0 = 0; r0 < NT; r0++) rows.push(TLO + (THI - TLO) * r0 / (NT - 1));
      var shapes = rows.map(function (T) {
        var nth = T >= 1 ? 1 : T * T * T, z = fug(T), n0 = 1 - nth;
        var A = nth / (2 * Math.PI * T * poly(z, INV3)), rx = 0.78 * Math.pow(n0, 0.2), ry = 0.52 * Math.pow(n0, 0.2);
        var B = n0 > 0 ? n0 / (2 * Math.PI / 5 * rx * ry) : 0, th = [], co = [];
        for (var i = 0; i < G; i++) for (var j = 0; j < G; j++) {
          var kx = K * (2 * i / (G - 1) - 1), ky = K * (2 * j / (G - 1) - 1);
          var tf = n0 > 0 ? Math.max(0, 1 - kx * kx / (rx * rx) - ky * ky / (ry * ry)) : 0;
          th.push(A * poly(z * Math.exp(-(kx * kx + ky * ky) / (2 * T)), INV2));
          co.push(B * Math.pow(tf, 1.5));
        }
        return [th, blur(co)];
      });
      // each part on the scale of the three printed temperatures, as before (the coldest row a little higher)
      var at = function (T) { return shapes[Math.round((T - TLO) / (THI - TLO) * (NT - 1))]; };
      var thTop = Math.max.apply(null, TEMPS.map(function (T) { return Math.max.apply(null, at(T)[0]); }));
      var coTop = Math.max.apply(null, TEMPS.map(function (T) { return Math.max.apply(null, at(T)[1]); }));
      var table = new Float32Array(NT * G * G);
      shapes.forEach(function (sp, r) { for (var k = 0; k < G * G; k++) table[r * G * G + k] = THERM * sp[0][k] / thTop + sp[1][k] / coTop; });
      var base = new Float32Array(N), XY = new Float32Array(2 * N), LXY = new Float32Array(2 * N);  // the shape now; each node's place in its panel, and in the world
      var CX = [-5.6, 0, 5.6], CY = [-3.4, 0, 3.4];  // (the panels' centres, side by side)
      for (var q0 = 0; q0 < TEMPS.length; q0++) for (var k0 = 0; k0 < G * G; k0++) {
        var n0 = q0 * G * G + k0; LXY[2 * n0] = K * (2 * Math.floor(k0 / G) / (G - 1) - 1); LXY[2 * n0 + 1] = K * (2 * (k0 % G) / (G - 1) - 1);
      }
      /** Every panel turned by phi about its own centre. */
      function turn(phi) {
        var c = Math.cos(phi), sn = Math.sin(phi);
        for (var n = 0; n < N; n++) { var q = Math.floor(n / (G * G)), x = LXY[2 * n], y = LXY[2 * n + 1]; XY[2 * n] = CX[q] + x * c - y * sn; XY[2 * n + 1] = CY[q] + x * sn + y * c; }
      }
      turn(0);
      /** Panel q's surface at temperature T (T/T_c), between two rows of the table. */
      function shape(q, T) {
        var x = Math.min(NT - 1.001, Math.max(0, (T - TLO) / (THI - TLO) * (NT - 1))), r = Math.floor(x), f = x - r, a = r * G * G, b = a + G * G, o = q * G * G;
        for (var k = 0; k < G * G; k++) base[o + k] = table[a + k] * (1 - f) + table[b + k] * f;
      }

      // the noise: a grain proportional to the density (5 %) over a floor (2.2 %); each node's two draws
      // move from one exposure to the next along cos/sin, so the grain keeps its strength all the way
      var gauss = function () { return Math.sqrt(-2 * Math.log(Math.random() + 1e-12)) * Math.cos(2 * Math.PI * Math.random()); };
      var fresh = function () { var a = new Float32Array(2 * N); for (var i = 0; i < 2 * N; i++) a[i] = gauss(); return a; };
      var nA = fresh(), nB = fresh(), t0 = 0, DRIFT = 900, h = new Float32Array(N);
      function heights(now) {
        var s = (now - t0) / DRIFT;
        if (s >= 1) { nA = nB; nB = fresh(); t0 = now; s = 0; }
        var c = Math.cos(s * Math.PI / 2), sn = Math.sin(s * Math.PI / 2);
        for (var i = 0; i < N; i++) {
          var m = nA[2 * i] * c + nB[2 * i] * sn, a = nA[2 * i + 1] * c + nB[2 * i + 1] * sn;
          h[i] = Math.max(0, base[i] * (1 + 0.05 * m) + 0.022 * a);
        }
      }

      // the view: turned (yaw), looked at from above (PITCH), in perspective (F); framed once per size
      var PITCH = 0.62, F = 26, HZ = 3.2, YAW = -0.5, W, H, dpr, fit;
      function proj(x, y, z, yaw, pitch) {
        var cy = Math.cos(yaw), sy = Math.sin(yaw), x1 = x * cy - y * sy, y1 = x * sy + y * cy, pc = Math.cos(pitch), ps = Math.sin(pitch);
        var depth = y1 * pc - z * ps, up = y1 * ps + z * pc, s = F / (F + depth);
        return [x1 * s, -up * s, depth];
      }
      function size() {
        dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        var keep = XY.slice();
        for (var a = 0; a < 8; a++) for (var pi = 0; pi < 2; pi++) {  // (the panels at every angle of their turn, the camera at both ends of its sway: the frame holds still)
          turn(a * Math.PI / 16); var yw = YAW + (pi ? SWAY : -SWAY), pt = PITCH + (pi ? TILT : -TILT);
          for (var i = 0; i < N; i += 5) { var q = proj(XY[2 * i], XY[2 * i + 1], base[i] * 1.1 * HZ, yw, pt); minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); }
        }
        XY.set(keep);
        var sc = Math.min(W * 0.92 / (maxX - minX), H * 0.94 / (maxY - minY));
        fit = [sc, W / 2 - sc * (minX + maxX) / 2, H / 2 - sc * (minY + maxY) / 2];
      }
      var gl = cv.getContext('webgl', { antialias: true, premultipliedAlpha: true, preserveDrawingBuffer: /[?&]glshot/.test(location.search) }), draw;  // (?glshot: kept for screenshots)
      if (gl) {
        var sh = function (type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
        var prog = gl.createProgram();
        gl.attachShader(prog, sh(gl.VERTEX_SHADER, [
          'attribute vec2 a_xy; attribute float a_h; uniform vec2 u_yaw, u_pitch, u_size; uniform vec3 u_fit; uniform float u_F, u_Hz; varying float v_h;',
          'void main() {',
          '  float z = a_h * u_Hz, x1 = a_xy.x * u_yaw.x - a_xy.y * u_yaw.y, y1 = a_xy.x * u_yaw.y + a_xy.y * u_yaw.x;',
          '  float depth = y1 * u_pitch.x - z * u_pitch.y, up = y1 * u_pitch.y + z * u_pitch.x, s = u_F / (u_F + depth);',
          '  vec2 p = vec2(u_fit.y + u_fit.x * x1 * s, u_fit.z - u_fit.x * up * s);',
          '  gl_Position = vec4(p.x / u_size.x * 2.0 - 1.0, 1.0 - p.y / u_size.y * 2.0, depth / 40.0, 1.0); v_h = a_h;',
          '}'].join('\n')));
        gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, [  // red, yellow, green, blue, white, by height; the mesh black
          'precision mediump float; uniform float u_line; varying float v_h;',
          'void main() {',
          '  if (u_line > 0.5) { gl_FragColor = vec4(0.0, 0.0, 0.0, 0.85); return; }',
          '  float t = clamp(v_h * 1.05, 0.0, 1.0); vec3 c;',
          '  if (t < 0.22) c = mix(vec3(170, 18, 14), vec3(230, 60, 20), t / 0.22);',
          '  else if (t < 0.4) c = mix(vec3(230, 60, 20), vec3(245, 215, 40), (t - 0.22) / 0.18);',
          '  else if (t < 0.58) c = mix(vec3(245, 215, 40), vec3(60, 185, 70), (t - 0.4) / 0.18);',
          '  else if (t < 0.8) c = mix(vec3(60, 185, 70), vec3(40, 95, 225), (t - 0.58) / 0.22);',
          '  else c = mix(vec3(40, 95, 225), vec3(245, 248, 255), (t - 0.8) / 0.2);',
          '  gl_FragColor = vec4(c / 255.0, 1.0);',
          '}'].join('\n')));
        gl.linkProgram(prog); gl.useProgram(prog);
        var U = function (n) { return gl.getUniformLocation(prog, n); };
        var buf = function (target, data, usage) { var b = gl.createBuffer(); gl.bindBuffer(target, b); gl.bufferData(target, data, usage); return b; };
        var tri = [], lin = [];  // two triangles a cell; a segment to the next node along each axis
        for (var q = 0; q < TEMPS.length; q++) for (var i = 0; i < G; i++) for (var j = 0; j < G; j++) {
          var k = q * G * G + i * G + j;
          if (i < G - 1 && j < G - 1) tri.push(k, k + G, k + G + 1, k, k + G + 1, k + 1);
          if (j < G - 1) lin.push(k, k + 1);
          if (i < G - 1) lin.push(k, k + G);
        }
        var xyBuf = buf(gl.ARRAY_BUFFER, XY, gl.DYNAMIC_DRAW); var aXY = gl.getAttribLocation(prog, 'a_xy'); gl.enableVertexAttribArray(aXY); gl.vertexAttribPointer(aXY, 2, gl.FLOAT, false, 0, 0);
        var hBuf = buf(gl.ARRAY_BUFFER, h, gl.DYNAMIC_DRAW); var aH = gl.getAttribLocation(prog, 'a_h'); gl.enableVertexAttribArray(aH); gl.vertexAttribPointer(aH, 1, gl.FLOAT, false, 0, 0);
        var triBuf = buf(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(tri), gl.STATIC_DRAW), linBuf = buf(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(lin), gl.STATIC_DRAW);
        gl.uniform1f(U('u_F'), F); gl.uniform1f(U('u_Hz'), HZ);
        gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.polygonOffset(1, 1);
        draw = function (c) {
          gl.viewport(0, 0, cv.width, cv.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          gl.bindBuffer(gl.ARRAY_BUFFER, xyBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, XY);
          gl.bindBuffer(gl.ARRAY_BUFFER, hBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, h);
          gl.uniform2f(U('u_yaw'), Math.cos(c.yaw), Math.sin(c.yaw)); gl.uniform2f(U('u_pitch'), Math.cos(c.pitch), Math.sin(c.pitch));
          gl.uniform2f(U('u_size'), W, H); gl.uniform3f(U('u_fit'), c.fit[0], c.fit[1], c.fit[2]);
          gl.enable(gl.POLYGON_OFFSET_FILL); gl.uniform1f(U('u_line'), 0); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, triBuf); gl.drawElements(gl.TRIANGLES, tri.length, gl.UNSIGNED_SHORT, 0);
          gl.disable(gl.POLYGON_OFFSET_FILL); gl.uniform1f(U('u_line'), 1); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, linBuf); gl.drawElements(gl.LINES, lin.length, gl.UNSIGNED_SHORT, 0);
        };
      } else {  // no graphics card to draw with: the same surface on a 2D canvas, once, back to front
        var cx = cv.getContext('2d');
        draw = function (c) {
          var quads = [], fit = c.fit;
          for (var q = 0; q < TEMPS.length; q++) for (var i = 0; i < G - 1; i++) for (var j = 0; j < G - 1; j++) {
            var k = q * G * G + i * G + j, c4 = [k, k + G, k + G + 1, k + 1].map(function (n) { return proj(XY[2 * n], XY[2 * n + 1], h[n] * HZ, c.yaw, c.pitch); });
            quads.push([c4, (c4[0][2] + c4[2][2]) / 2, (h[k] + h[k + G] + h[k + G + 1] + h[k + 1]) / 4]);
          }
          quads.sort(function (a, b) { return b[1] - a[1]; });
          cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, H); cx.lineWidth = 0.5; cx.strokeStyle = 'rgba(0,0,0,0.85)';
          quads.forEach(function (qd) {
            var t = Math.min(1, qd[2] * 1.05), r = t < 0.4 ? 230 : t < 0.58 ? 245 - 1030 * (t - 0.4) : t < 0.8 ? 50 : 245 * (t - 0.8) * 5;
            var g = t < 0.22 ? 18 + 190 * t : t < 0.4 ? 60 + 860 * (t - 0.22) : t < 0.58 ? 215 : t < 0.8 ? 185 - 410 * (t - 0.58) : 95 + 760 * (t - 0.8);
            var b = t < 0.58 ? 20 : t < 0.8 ? 70 + 700 * (t - 0.58) : 225;
            cx.beginPath(); qd[0].forEach(function (p, m) { cx[m ? 'lineTo' : 'moveTo'](fit[1] + fit[0] * p[0], fit[2] + fit[0] * p[1]); });
            cx.closePath(); cx.fillStyle = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')'; cx.fill(); cx.stroke();
          });
        };
      }
      // the run, PERIOD s round: the three clouds start above T_c, cool one after the other to their printed
      // temperatures, stand, then warm together; all the while each panel turns once round in SPIN s and
      // the camera sways round and up and down. Still (reduced motion): the printed picture, unturned
      var PERIOD = 30, HOT = 1.2, SPIN = 60, SWAY = 0.3, TILT = 0.14;
      var ease = function (a, b, x) { var u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
      function camAt(sec) {
        var u = sec % PERIOD, T = [];
        for (var q = 0; q < TEMPS.length; q++) {
          var a = 2 + 3.5 * q;  // (panel q cools over [a, a + 4.5], all warm over [24, 28])
          T.push(HOT + (TEMPS[q] - HOT) * ease(a, a + 4.5, u) + (HOT - TEMPS[q]) * ease(24, 28, u));
        }
        return { T: T, phi: 2 * Math.PI * sec / SPIN, yaw: YAW + SWAY * Math.sin(2 * Math.PI * sec / 17), pitch: PITCH + TILT * Math.sin(2 * Math.PI * sec / 23) };
      }
      var cam = { T: TEMPS, phi: 0, yaw: YAW, pitch: PITCH };
      var view = function (c) { c.fit = fit; turn(c.phi); return c; };
      function place(c) { for (var q = 0; q < TEMPS.length; q++) shape(q, c.T[q]); }
      place(cam); heights(0);
      // the canvas follows its own size (the page settles after the fonts and pictures arrive)
      new ResizeObserver(function () { if (!cv.clientWidth || !cv.clientHeight) return; size(); draw(view(cam)); }).observe(cv);
      if (still || !gl) return;
      var on = true;
      new IntersectionObserver(function (e) { on = e[0].isIntersecting; }).observe(cv);
      (function frame(now) {  // every frame: the run's moment, the grain drifting
        requestAnimationFrame(frame);
        if (!on || document.hidden || !fit) return;
        cam = camAt(now / 1000); place(cam); heights(now); draw(view(cam));
      })(0);
    })();
  </script>
</body>
</html>
