# Tool config only (house rule): the site's helpers in _tools/ are stdlib scripts, except
# make_assets.py, illuminations.py and trame.py (NumPy, Pillow from the root environment).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I", "E9", "W6", "PLE"]

[tool.ruff.lint.isort]
known-first-party = ["illuminations", "colour", "real"]
