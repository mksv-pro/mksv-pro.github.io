    </div>
  </div>

  <form class="cmdline" id="cmdline" hidden autocomplete="off">
    <p class="cmd-out" id="cmd-out" aria-live="polite"></p>
    <p class="cmd-row">
      <label for="cmd-in">:</label>
      <input id="cmd-in" name="cmd" type="text" spellcheck="false" autocapitalize="off"
             enterkeyhint="go" aria-describedby="cmd-hint">
      <span class="cmd-hint" id="cmd-hint">help &middot; Esc to close</span>
    </p>
  </form>

  <footer class="status" aria-label="Status line">
    <p class="st-left">
      <span class="st-name">{{name}}</span>
      <button class="dlvl" id="descend" type="button" title="Current degree. Click to walk the site in first person (&gt;)"><i class="lbl" data-castle="Rank">Dlvl</i>:<b id="st-dlvl">MSc</b></button>
      <span title="A joke: the bent of the research"><i class="lbl" data-castle="Humour">Align</i>:<b id="st-align">stochastic</b></span>
{{stats}}
      <span hidden id="st-explored" title="Sections visited so far"><i class="lbl" data-castle="Rooms">Explored</i>:<b>0/{{n_rooms}}</b></span>
      <span hidden id="st-curios" title="Curiosities of the landscape found (click what you see)"><i class="lbl" data-castle="Marvels">Curios</i>:<b>0/12</b></span>
    </p>
    <p class="st-right" aria-hidden="true">
      <span id="st-hour"></span>
      <span id="st-moon"></span>
    </p>
    <button class="cmd-toggle" id="cmd-toggle" type="button" aria-controls="cmdline" aria-expanded="false"
            title="Command line (:)"><span class="lbl" data-castle="[orders]">[:]</span><span class="sr-only">Command line</span></button>
    <button class="theme-toggle" id="theme-toggle" type="button">
      <span class="sr-only">Switch theme to </span><span id="theme-next">[hours]</span>
    </button>
    <button class="keys-toggle sound-toggle" id="sound-toggle" type="button" aria-pressed="false"
            title="Ambient sound of the landscape (castle theme)">sound:<b>off</b></button>
    <button class="keys-toggle" id="keys-toggle" type="button" aria-pressed="true"
            title="Single-key shortcuts (1-{{n_tabs}}, :, ?)">keys:<b>on</b></button>
  </footer>

  <script type="application/json" id="site-data">{{site_json}}</script>
  <script src="{{root}}assets/js/sky.js?v={{v:assets/js/sky.js}}"></script>
  <script src="{{root}}script.js?v={{v:script.js}}" data-dungeon="{{root}}assets/js/dungeon.js?v={{v:assets/js/dungeon.js}}" data-hours="{{root}}assets/js/hours.js?v={{v:assets/js/hours.js}}" data-arms="{{root}}assets/js/arms.js?v={{v:assets/js/arms.js}}" data-sound="{{root}}assets/js/sound.js?v={{v:assets/js/sound.js}}"></script>
  <script src="{{root}}assets/js/cmdline.js?v={{v:assets/js/cmdline.js}}"></script>
  <script src="{{root}}assets/js/armillary.js?v={{v:assets/js/armillary.js}}"></script>{{scripts}}
