# ---- research (the quest log) ----------------------------------------------------------

[[research]]
org = "IJCLab"
arms = "ijclab"
from = "2026-06"
to = "2026-07"
role = "Research intern · with Chloé Hebborn &amp; Patrick McGlynn"
text = """Scattering solvers (R-matrix, DBMM) and reduced-basis and machine-learning emulators
for nuclear reactions, benchmarked for large parameter-space exploration.
<a href="projects/nuclear-emulators.html">The project →</a>"""

[[research]]
org = "CEREMADE"
arms = "ceremade"
from = "2024-09"
to = "2025-01"
role = "Visiting research student · with Pierre Cardaliaguet"
text = """Mean-field games applied to economics: how monetary shocks propagate in a
general-equilibrium economy with sticky prices, through coupled
Hamilton–Jacobi–Bellman and Fokker–Planck equations."""

[[research]]
org = "Sciences Po Paris"
arms = "sciencespo"
from = "2023-06"
to = "2023-08"
role = "Research assistant · with Julia Cagé"
text = """Media ownership and content bias: built a large dataset of French television
broadcasts for the study."""

# ---- projects (cards on the index; each has its own page under _src/projects/) ---------

[[projects]]
id = "nuclear-emulators"
title = "Computational emulation of nuclear dynamics"
date = "2026"
role = "M1 internship · IJCLab"
alt = "Project page: illumination of a plane wave scattering off a nucleus"
text = """A coupled-channel scattering solver and two emulators (RBM, LROM) that reproduce it
within 0.5&nbsp;% at the median, at a fraction of its cost, to make uncertainty quantification on
optical potentials affordable."""
actions = [
  { label = "page", href = "projects/nuclear-emulators.html" },
  { label = 'report <span class="meta">PDF</span>', href = "{{url:report}}" },
  { label = "code", href = "{{url:report_code}}" },
]

[[projects]]
id = "urban-morphogenesis"
title = "Urban morphogenesis"
date = "2026-01"
role = "With Raphael Raynaud · Université Paris Cité"
alt = "Project page: illumination of a diffusion-limited aggregation cluster in gold on green"
text = """An agent-based city grown from Schelling segregation and diffusion-limited
aggregation, and the fractal dimension of what it builds."""
actions = [{ label = "page &amp; live DLA", href = "projects/urban-morphogenesis.html" }]

[[projects]]
id = "n-body"
title = "Self-gravitating N-body systems"
date = "2024-02"
role = "With Lionel Foret · Sorbonne Université"
alt = "Project page: illumination of three bodies on the figure-eight orbit among stars"
text = """Direct-integration simulation of gravitating bodies and of the collective behaviour
that long-range forces produce."""
actions = [{ label = "page &amp; live orbits", href = "projects/n-body.html" }]

