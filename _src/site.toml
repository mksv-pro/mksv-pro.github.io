# ---- research (the quest log) ----------------------------------------------------------

[[research]]
org = "IJCLab"
cv_org = "IJCLab – Irène Joliot-Curie Laboratory (CNRS / Université Paris Cité)"
city = "Orsay, France"
cv_role = "Research Intern, supervised by Chloé Hebborn and Patrick McGlynn"
cv_text = """Emulation of nuclear reaction models for uncertainty quantification on optical potentials.
Thesis: <i>Computational Emulation of Nuclear Dynamics</i>, graded 18/20
(<a href="{{url:report_code}}">report and code</a>)."""
cv_bullets = [
  "Developed a coupled-channel scattering solver based on the Direct Boundary Matching Method (DBMM), validated against an independent R-matrix calculation",
  "Built two emulators (reduced basis method; learning reduced-order model, first coupled-channel extension) matching the solver within 5×10<sup>−3</sup> (median) on four systems with up to 8 coupled channels and 10 parameters",
  "Benchmarked both against the solver: speed-ups grow with system size, and the learning model gains 1.3–1.9× more",
]
arms = "ijclab"
from = "2026-06"
to = "2026-07"
role = "Research intern · with Chloé Hebborn &amp; Patrick McGlynn"
text = """Scattering solvers (R-matrix, DBMM) and reduced-basis and machine-learning emulators
for nuclear reactions, benchmarked for large parameter-space exploration.
<a href="projects/nuclear-emulators.html">The project →</a>"""

[[research]]
org = "CEREMADE"
cv_org = "CEREMADE, Université Paris Dauphine-PSL"
city = "Paris, France"
cv_role = "Visiting Research Student, supervised by Pierre Cardaliaguet"
cv_text = "Mean-field games applied to the propagation of monetary shocks in a general-equilibrium economy with sticky prices."
cv_bullets = [
  "Studied differential games and mean-field models of strategic interactions between heterogeneous agents",
  "Analyzed the coupled Hamilton–Jacobi–Bellman and Fokker–Planck equations arising in dynamic economic models",
  "Applied mathematical and computational tools to monetary policy and collective decision-making",
]
arms = "ceremade"
from = "2024-09"
to = "2025-01"
role = "Visiting research student · with Pierre Cardaliaguet"
text = """Mean-field games applied to economics: how monetary shocks propagate in a
general-equilibrium economy with sticky prices, through coupled
Hamilton–Jacobi–Bellman and Fokker–Planck equations."""

[[research]]
org = "Sciences Po Paris"
cv_org = "Sciences Po"
city = "Paris, France"
cv_role = "Research Assistant, supervised by Julia Cagé"
cv_text = "Built a large-scale dataset of French television broadcasts for a study of media ownership and content bias."
arms = "sciencespo"
from = "2023-06"
to = "2023-08"
role = "Research assistant · with Julia Cagé"
text = """Media ownership and content bias: built a large dataset of French television
broadcasts for the study."""

# ---- projects (cards on the index; each has its own page under _src/projects/) ---------

[[projects]]
id = "nuclear-emulators"
title = "Computational emulation of nuclear dynamics"
date = "2026"
role = "M1 internship · IJCLab"
alt = "Project page: illumination of a plane wave scattering off a nucleus"
text = """A coupled-channel scattering solver and two emulators (RBM, LROM) that reproduce it
within 0.5&nbsp;% at the median, at a fraction of its cost, to make uncertainty quantification on
optical potentials affordable."""
actions = [
  { label = "page", href = "projects/nuclear-emulators.html" },
  { label = 'report <span class="meta">PDF</span>', href = "{{url:report}}" },
  { label = "code", href = "{{url:report_code}}" },
]

[[projects]]
