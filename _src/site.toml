# The site's data: one source for every fact the pages, the scripts and the feed repeat.
# Text fields are HTML (UTF-8, no entities needed) and may use {{tokens}}: {{url:key}},
# {{root}}, {{email}}, {{github}}. Dates: "YYYY" or "YYYY-MM". Lists are newest first.
# Rebuild after any change:  python3 _tools/build.py && python3 _tools/check.py

# Tab order (the number keys follow it). An empty section still shows, with a line saying so.
tabs = ["about", "research", "projects", "publications", "talks", "teaching", "news", "contact"]

talks = []
# { title = "…", date = "YYYY-MM", venue = "Event, City", actions = [{ label = "slides", href = "…" }] }
teaching = []
# { title = "Course name (TD)", date = "YYYY", venue = "Level, University" }

[site]
url = "https://mksv-pro.github.io/"
name = "Mike Silva"
role = "Graduate student in physics"
place = "Paris"
email = "pro.mikesilva@gmail.com"
github = "https://github.com/mksv-pro"

[urls]
report = "https://github.com/mksv-pro/Mike-M1-Internship-IJCLab-2026/blob/main/docs/memoire_M1.pdf"
report_code = "https://github.com/mksv-pro/Mike-M1-Internship-IJCLab-2026"

