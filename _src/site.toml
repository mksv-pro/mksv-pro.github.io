# ---- heraldry (hours theme) --------------------------------------------------------------
# Arms drawn after each institution's emblem (_tools/arms.txt), not their logos. `own`: the
# knight's shield. `tapestry`: one wall hanging per institution, in the order first met
# ([arms, name, what was done there]); the labs hang in the observatory, the schools in the hall.
[heraldry]
own = "silva"
tapestry = [
  ["sorbonne", "Sorbonne Université", "BSc Physics & Mathematics; MSc Quantum Information"],
  ["paris1", "Université Paris 1 Panthéon-Sorbonne", "BA Economics & Political Science"],
  ["sciencespo", "Sciences Po", "Research assistant"],
  ["ceremade", "CEREMADE", "Visiting research student"],
  ["pariscite", "Université Paris Cité", "MSc Fundamental Physics"],
  ["dauphine", "Université Paris Dauphine-PSL", "MSc Economics & Finance"],
  ["ijclab", "IJCLab", "Research intern"],
  ["saclay", "Université Paris-Saclay", "MSc Physics of Complex Systems"],
]

